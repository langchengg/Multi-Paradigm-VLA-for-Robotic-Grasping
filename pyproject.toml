[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-grasp-decoder-benchmark"
version = "0.1.0"
description = "CLIP-conditioned action decoder benchmark for Franka Panda MuJoCo grasping."
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

